<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K Running Club | Running Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#172235;--muted:#a5b4c7;--accent:#6ee7b7;--line:#344258}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fc;font:16px system-ui,'Microsoft JhengHei',sans-serif}main{max-width:1100px;margin:auto;padding:32px 18px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:clamp(26px,4vw,38px);margin:0}h2{font-size:19px;margin:0 0 18px}.sub,.muted{color:var(--muted)}.sub{margin:8px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap}button,.upload{border:1px solid #45576d;border-radius:10px;padding:11px 15px;background:#233248;color:#fff;cursor:pointer;font:inherit}.upload{background:var(--accent);color:#0c1922;border-color:var(--accent);font-weight:700}input[type=file]{display:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}.card,.panel{background:var(--panel);border:1px solid #2b3a51;border-radius:16px;padding:21px}.card span{color:var(--muted);font-size:14px}.card strong{display:block;font-size:clamp(22px,3vw,30px);margin-top:8px}.card small{font-size:14px;font-weight:400;color:var(--muted)}.panel{margin:18px 0}.chart{display:flex;gap:9px;align-items:end;height:210px;padding-top:25px;overflow-x:auto}.bar-col{flex:1;min-width:34px;display:flex;align-items:center;flex-direction:column;justify-content:end;height:100%;gap:6px}.bar{width:75%;max-width:60px;background:linear-gradient(180deg,#6ee7b7,#259b8e);border-radius:7px 7px 0 0;min-height:2px}.bar-label{font-size:12px;color:var(--muted);white-space:nowrap}.bar-value{font-size:11px;color:#e3f8ed}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}select,input[type=search]{background:#0e192a;color:#fff;border:1px solid #43536b;border-radius:9px;padding:9px 12px;font:inherit}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #2e3b50}th{font-size:13px;color:var(--muted)}.table-wrap{overflow-x:auto}.empty{color:var(--muted);text-align:center;padding:36px 10px}.note{font-size:13px;color:var(--muted);line-height:1.8}.status{font-size:14px;color:var(--accent);min-height:22px;margin-top:12px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.card,.panel{padding:15px}main{padding-top:22px}}@media(max-width:390px){.cards{gap:9px}.card strong{font-size:22px}}
</style>
</head>
<body><main>
<header><div><h1>K Running Club</h1><p class="sub">Garmin 跑步數據儀表板</p></div><div class="actions"><label class="upload" for="csv">匯入 Garmin CSV</label><input id="csv" type="file" accept=".csv,text/csv"><button id="clear">清除紀錄</button></div></header>
<p id="status" class="status" aria-live="polite"></p>
<section class="cards"><div class="card"><span>累積距離</span><strong id="distance">0 <small>km</small></strong></div><div class="card"><span>跑步次數</span><strong id="runs">0 <small>次</small></strong></div><div class="card"><span>平均配速</span><strong id="pace">-- <small>/km</small></strong></div><div class="card"><span>累積跑步時間</span><strong id="duration">0 <small>小時</small></strong></div></section>
<section class="panel"><h2>每月跑量（公里）</h2><div id="chart" class="chart"></div></section>
<section class="panel"><div class="toolbar"><h2 style="margin:0">跑步紀錄</h2><div class="actions"><input type="search" id="search" placeholder="搜尋日期或活動名稱"><select id="year"><option value="all">所有年份</option></select></div></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>活動名稱</th><th>距離</th><th>時間</th><th>平均配速</th></tr></thead><tbody id="records"></tbody></table></div><p id="count" class="note"></p></section>
<p class="note">資料只儲存在目前瀏覽器的本機儲存空間，不會上傳到 GitHub 或伺服器。換裝置或清除瀏覽器資料後，請重新匯入 CSV。支援常見 Garmin Connect 英文與繁體中文活動 CSV 欄位；建議匯出「活動」清單，並確認包含日期、距離與時間。</p>
</main><script>
const $=id=>document.getElementById(id);let data=[];
try{data=JSON.parse(localStorage.getItem('running-dashboard-v1')||'[]');if(!Array.isArray(data))data=[]}catch{data=[]}
const number=v=>{let s=String(v??'').trim().replace(/,/g,'').replace(/\s*(km|公里|kilometers?)$/i,'');let n=Number(s);return Number.isFinite(n)?n:NaN};
function csvParse(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}
function get(row,headers,aliases){for(const a of aliases){let i=headers.findIndex(h=>h===a.toLowerCase());if(i>=0)return row[i]||''}return ''}
function seconds(v){let s=String(v||'').trim();if(!s)return NaN;if(/^\d+(?:\.\d+)?$/.test(s))return Number(s);let parts=s.split(':').map(Number);if(parts.some(n=>!Number.isFinite(n))||parts.length<2||parts.length>3)return NaN;return parts.reduce((a,b)=>a*60+b,0)}
function dateParse(v){let s=String(v||'').trim();let m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);if(m)return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;return ''}
function parseActivities(text){const rows=csvParse(text);if(rows.length<2)throw Error('CSV 沒有可讀取的資料');const headers=rows[0].map(s=>s.trim().toLowerCase());if(!headers.some(h=>['distance','距離'].includes(h)))throw Error('找不到「距離 / Distance」欄位，請匯出 Garmin 活動清單 CSV');let result=[];for(const row of rows.slice(1)){const type=get(row,headers,['Activity Type','活動類型','類型','Type']);if(type&&!(/run|running|跑步|越野跑|trail/i.test(type)))continue;const date=dateParse(get(row,headers,['Date','日期','開始時間','Start Time']));const dist=number(get(row,headers,['Distance','距離']));let dur=seconds(get(row,headers,['Time','時間','Moving Time','移動時間','Elapsed Time','經過時間']));if(!Number.isFinite(dur)){const p=seconds(get(row,headers,['Avg Pace','平均配速','Average Pace']));if(Number.isFinite(p)&&Number.isFinite(dist))dur=p*dist}if(!date||!Number.isFinite(dist)||dist<=0||!Number.isFinite(dur)||dur<=0)continue;result.push({date,name:get(row,headers,['Title','標題','活動名稱','Activity Name'])||'跑步',distance:dist,duration:dur})}return result}
function fmtPace(s){if(!Number.isFinite(s)||s<=0)return '--';let t=Math.round(s);return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`}
function fmtDuration(s){s=Math.round(s);let h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`}
function persist(){try{localStorage.setItem('running-dashboard-v1',JSON.stringify(data))}catch{$('status').textContent='瀏覽器儲存空間不足；資料可能無法保留。'}}
function render(){const years=[...new Set(data.map(r=>r.date.slice(0,4)))].sort().reverse();let selected=$('year').value;$('year').replaceChildren(new Option('所有年份','all'),...years.map(y=>new Option(y,y)));$('year').value=years.includes(selected)?selected:'all';let filtered=data.filter(r=>$('year').value==='all'||r.date.startsWith($('year').value));const dist=filtered.reduce((s,r)=>s+r.distance,0),dur=filtered.reduce((s,r)=>s+r.duration,0);$('distance').innerHTML=`${dist.toFixed(1)} <small>km</small>`;$('runs').innerHTML=`${filtered.length} <small>次</small>`;$('pace').innerHTML=`${fmtPace(dur/dist)} <small>/km</small>`;$('duration').innerHTML=`${(dur/3600).toFixed(1)} <small>小時</small>`;let months={};filtered.forEach(r=>{let k=r.date.slice(0,7);months[k]=(months[k]||0)+r.distance});let keys=Object.keys(months).sort().slice(-12),max=Math.max(...Object.values(months),1);$('chart').replaceChildren();if(!keys.length){$('chart').innerHTML='<div class="empty" style="width:100%">匯入 Garmin CSV 後顯示每月跑量</div>'}else for(const k of keys){let col=document.createElement('div');col.className='bar-col';let val=document.createElement('span');val.className='bar-value';val.textContent=months[k].toFixed(1);let bar=document.createElement('div');bar.className='bar';bar.style.height=`${Math.max(2,months[k]/max*155)}px`;let lab=document.createElement('span');lab.className='bar-label';lab.textContent=k.slice(2);col.append(val,bar,lab);$('chart').append(col)}let q=$('search').value.trim().toLowerCase();let visible=filtered.filter(r=>`${r.date} ${r.name}`.toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));$('records').replaceChildren();for(const r of visible.slice(0,500)){let tr=document.createElement('tr');for(const v of [r.date,r.name,`${r.distance.toFixed(2)} km`,fmtDuration(r.duration),`${fmtPace(r.duration/r.distance)} /km`]){let td=document.createElement('td');td.textContent=v;tr.append(td)}$('records').append(tr)}if(!visible.length)$('records').innerHTML='<tr><td colspan="5" class="empty">尚無符合條件的跑步紀錄</td></tr>';$('count').textContent=`顯示 ${Math.min(visible.length,500)} / ${visible.length} 筆紀錄`}
$('csv').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const text=await file.text();let incoming=parseActivities(text);if(!incoming.length)throw Error('沒有辨識到跑步資料。請檢查 CSV 活動類型與日期、距離、時間欄位。');let map=new Map(data.map(r=>[`${r.date}|${r.name}|${r.distance}|${r.duration}`,r]));for(const r of incoming)map.set(`${r.date}|${r.name}|${r.distance}|${r.duration}`,r);data=[...map.values()];persist();$('status').textContent=`成功讀取 ${incoming.length} 筆跑步紀錄，目前共有 ${data.length} 筆（重複資料已略過）。`;render()}catch(err){$('status').textContent=`匯入失敗：${err.message}`}e.target.value=''});
$('clear').addEventListener('click',()=>{if(confirm('確定要清除這個瀏覽器儲存的所有跑步紀錄嗎？')){data=[];persist();$('status').textContent='紀錄已清除';render()}});$('year').addEventListener('change',render);$('search').addEventListener('input',render);render();
</script></body></html>
